name: fittrack
description: 简瘦 - 个人减肥锻炼记录 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_tts: ^4.0.2
  timezone: ^0.10.1
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# sqlite3 的原生资产钩子默认从 github.com 下载预编译库，
# 本机网络无法访问该域名，故在 Windows（宿主测试）上改用系统自带的 winsqlite3.dll。
# Android 目标仍走 default，行为不变。
hooks:
  user_defines:
    sqlite3:
      source:
        default: sqlite3
        windows: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/js.jpg
    - assets/planet/
    - assets/guga/
    - assets/guga2d/
    - assets/guga3d/

flutter_launcher_icons:
  image_path: "assets/js.jpg"
  android: true
  ios: false

flutter_native_splash:
  # 原 assets/kp.png 是满屏深色海报，浅色主题下会让启动首帧仍然发黑，
  # 故改为纯品牌暖白底启动（如需恢复海报，取消下面 image 注释后重跑 create）。
  # image: assets/kp.png
  color: "F7F4F0"
  android: true
  ios: false
  android_12:
    # image: assets/kp.png
    color: "F7F4F0"
