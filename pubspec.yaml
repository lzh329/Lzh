name: fittrack
description: 简瘦 - 个人减肥锻炼记录 App
publish_to: 'none'
version: 2.5.0+2026

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_tts: ^4.0.2
  # 云端音色（MiniMax T2A）返回 MP3 字节，用 audioplayers 直接播 BytesSource
  audioplayers: ^6.1.0
  timezone: ^0.10.1
  wakelock_plus: ^1.5.2
  http: ^1.2.2
  # 备份打包（zip：整库快照 + photos/ + manifest.json）。
  # 原本只是 transitive，直接 import 会触发 depend_on_referenced_packages，
  # 让 flutter analyze 红、check.sh 挂掉，所以必须显式声明。
  archive: ^3.6.1
  # manifest 里的 dbSha256（校验包内数据库是否损坏/被替换）
  crypto: ^3.0.3
  # 角色动效（可选增强，缺 .riv 就走程序化降级）。
  # ⚠️ 精确版本，不要加 ^：0.14.x 起改用 rive_native（native assets hook 要从
  # GitHub 拉预编译库），本机网络已为 sqlite3 打过 hooks 补丁，不再引第二条网络依赖。
  # package:rive 全库只允许被 character_rive_adapter.dart 一个文件 import。
  rive: 0.13.20
  # Edge TTS：vendor 本地副本（微软 2026-10 迁移了合成端点，pub 上的旧包仍写死
  # 旧地址 speech.platform.bing.com → 一律 403）。这里改用本地修补版，把端点切到
  # api.msedgeservices.com。
  edge_tts:
    path: packages/edge_tts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.13.1
  # 仅测试用：直接造旧版本 sqlite 文件来验证迁移
  sqlite3: ^2.4.0

# sqlite3 的原生资产钩子默认从 github.com 下载预编译库，
# 本机网络无法访问该域名，故在 Windows（宿主测试）上改用系统自带的 winsqlite3.dll。
# Android 目标仍走 default，行为不变。
hooks:
  user_defines:
    sqlite3:
      source:
        default: sqlite3
        windows: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/js.jpg
    - assets/planet/
    - assets/guga/
    - assets/guga2d/
    - assets/guga3d/
    # 目录声明而不是逐文件（R3）：用户替换同名文件即生效，不改代码。
    # ⚠️ 两个目录内必须有占位文件 —— 空目录会让构建报
    # "unable to find directory entry"。assets/rive/ 目前只有一个 PROVENANCE.md。
    - assets/characters/
    - assets/rive/

flutter_launcher_icons:
  image_path: "assets/js.jpg"
  android: true
  ios: false

